{% extends "base.html" %}
{% block titulo %}Editar proveedor{% endblock %}
{% block contenido %}
<section class="tarjeta">
  <h1>Editar proveedor #{{ proveedor.id }}</h1>
  {% if error %}
  <p class="error" role="alert">{{ error }}</p>
  {% endif %}
  <form method="post" action="/proveedores/{{ proveedor.id }}/editar">
    <label for="nombre">Nombre</label>
    <input id="nombre" name="nombre" value="{{ nombre }}" maxlength="100" required>
    <button type="submit">Guardar</button>
    <a href="/proveedores" class="volver">Cancelar</a>
  </form>
</section>
{% endblock %}
