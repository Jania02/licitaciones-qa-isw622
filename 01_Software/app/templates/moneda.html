{% extends "base.html" %}{% block titulo %}Moneda{% endblock %}{% block contenido %}
<section class="tarjeta"><h1>Tipo de cambio CRC/USD</h1><form id="tasa" class="campos"><input name="id" type="hidden"><label>CRC por USD <input name="crc_por_usd" type="number" step="any" min="0.000001" required></label><button>Guardar</button><button type="reset">Cancelar</button></form><div class="fila"><button id="externa" class="sec">Consultar tasa externa</button></div><ul id="tasas"></ul><div class="campos"><label>Visualizar en <select id="moneda"><option>CRC</option><option>USD</option></select></label></div><p id="mensaje" role="status"></p><pre id="vista"></pre></section>
<script>
const f=document.querySelector('#tasa'),lista=document.querySelector('#tasas'),msg=document.querySelector('#mensaje'),m=document.querySelector('#moneda');
async function req(path,method='GET',data){const r=await fetch('/api/'+path,{method,headers:{'Content-Type':'application/json'},body:data===undefined?undefined:JSON.stringify(data)});if(!r.ok){const e=await r.json();throw Error(typeof e.detail==='string'?e.detail:'Datos inválidos');}return r.status===204?null:r.json();}
async function vista(){const d=await req('moneda?moneda='+m.value);document.querySelector('#vista').textContent=JSON.stringify(d,null,2);}
async function cargar(){lista.replaceChildren();for(const t of await req('tasas')){const li=document.createElement('li');li.textContent=t.crc_por_usd+' CRC/USD — '+t.fecha+' ('+t.fuente+') ';for(const [n,fn] of [['Editar',()=>{f.elements.id.value=t.id;f.elements.crc_por_usd.value=t.crc_por_usd;}],['Eliminar',()=>accion(()=>req('tasas/'+t.id,'DELETE'))]]){const b=document.createElement('button');b.textContent=n;b.onclick=fn;li.append(b);}lista.append(li);}await vista();}
async function accion(fn){try{await fn();await cargar();msg.textContent='Operación completada';}catch(e){msg.textContent=e.message;}}
f.onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));const id=d.id;delete d.id;accion(async()=>{await req('tasas'+(id?'/'+id:''),id?'PUT':'POST',d);f.reset();});};document.querySelector('#externa').onclick=()=>accion(()=>req('tasas/externa','POST'));m.onchange=()=>vista().catch(e=>msg.textContent=e.message);cargar().catch(e=>msg.textContent=e.message);
</script>{% endblock %}
