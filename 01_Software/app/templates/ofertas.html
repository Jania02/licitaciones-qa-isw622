{% extends "base.html" %}
{% block titulo %}Ofertas{% endblock %}
{% block contenido %}
<section class="tarjeta"><h1>Ofertas</h1>
<form id="oferta"><label>Licitación <select name="licitacion_id" required></select></label><label>Proveedor <select name="proveedor_id" required></select></label><label>Monto CRC <input name="monto_crc" type="number" min="0.01" step="0.01" required></label><button>Registrar</button></form>
<label>Filtrar por licitación <select id="filtroL"><option value="">Todas</option></select></label><label>Filtrar por proveedor <select id="filtroP"><option value="">Todos</option></select></label>
<p id="mensaje" role="status"></p><ul id="lista"></ul></section>
<script>
const form=document.querySelector('#oferta'), msg=document.querySelector('#mensaje'), lista=document.querySelector('#lista'), fl=document.querySelector('#filtroL'), fp=document.querySelector('#filtroP');
async function req(url,method='GET',data){const r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:data===undefined?undefined:JSON.stringify(data)});if(!r.ok){const e=await r.json();throw Error(typeof e.detail==='string'?e.detail:'Datos inválidos');}return r.status===204?null:r.json();}
function add(sel,id,txt){const o=document.createElement('option');o.value=id;o.textContent=txt;sel.append(o);}
async function cargar(){const p=new URLSearchParams();if(fl.value)p.set('licitacion_id',fl.value);if(fp.value)p.set('proveedor_id',fp.value);lista.replaceChildren();for(const o of await req('/api/ofertas?'+p)){const li=document.createElement('li');li.textContent='Licitación '+o.licitacion_id+' / proveedor '+o.proveedor_id+' — CRC '+o.monto_crc+' ';for(const [n,f] of [['Editar',()=>{const m=prompt('Nuevo monto CRC',o.monto_crc);if(m!==null)accion(()=>req('/api/ofertas/'+o.id,'PUT',{monto_crc:m}));}],['Retirar',()=>accion(()=>req('/api/ofertas/'+o.id,'DELETE'))]]){const b=document.createElement('button');b.textContent=n;b.onclick=f;li.append(b);}lista.append(li);}}
async function accion(f){try{await f();msg.textContent='Operación completada';await cargar();}catch(e){msg.textContent=e.message;}}
form.onsubmit=e=>{e.preventDefault();accion(()=>req('/api/ofertas','POST',Object.fromEntries(new FormData(form))));};fl.onchange=fp.onchange=()=>accion(cargar);
(async()=>{for(const l of await req('/api/licitaciones')){add(fl,l.id,l.codigo);if(l.estado==='Publicada')add(form.elements.licitacion_id,l.id,l.codigo);}for(const p of await req('/api/proveedores')){add(fp,p.id,p.nombre);add(form.elements.proveedor_id,p.id,p.nombre);}await cargar();})().catch(e=>msg.textContent=e.message);
</script>
{% endblock %}
