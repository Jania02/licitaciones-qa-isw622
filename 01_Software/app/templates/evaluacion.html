{% extends "base.html" %}{% block titulo %}Evaluación{% endblock %}{% block contenido %}
<section class="tarjeta"><h1>Evaluación de licitaciones</h1><select id="licitacion"></select><button id="evaluar">Evaluar</button><pre id="resultado"></pre><h2>Rangos de aprobación</h2><form id="rango"><input name="id" type="hidden"><label>Mínimo CRC <input name="minimo_crc" required type="number" step="0.01" min="0.01"></label><label>Máximo CRC (vacío = sin límite) <input name="maximo_crc" type="number" step="0.01"></label><label>Aprobador <input name="aprobador" required></label><button>Guardar rango</button><button type="reset">Cancelar</button></form><p id="mensaje" role="status"></p><ul id="rangos"></ul></section>
<script>
const sel=document.querySelector('#licitacion'),form=document.querySelector('#rango'),lista=document.querySelector('#rangos'),msg=document.querySelector('#mensaje');
async function req(path,method='GET',data){const r=await fetch('/api/'+path,{method,headers:{'Content-Type':'application/json'},body:data===undefined?undefined:JSON.stringify(data)});if(!r.ok){const e=await r.json();throw Error(typeof e.detail==='string'?e.detail:'Datos inválidos');}return r.status===204?null:r.json();}
async function act(f){try{await f();await cargar();msg.textContent='Operación completada';}catch(e){msg.textContent=e.message;}}
async function cargar(){lista.replaceChildren();for(const r of await req('rangos')){const li=document.createElement('li');li.textContent=r.minimo_crc+' — '+(r.maximo_crc??'sin límite')+' | '+r.aprobador+' ';for(const [n,f] of [['Editar',()=>{for(const k of ['id','minimo_crc','maximo_crc','aprobador'])form.elements[k].value=r[k]??'';}],['Eliminar',()=>act(()=>req('rangos/'+r.id,'DELETE'))]]){const b=document.createElement('button');b.textContent=n;b.onclick=f;li.append(b);}lista.append(li);}}
form.onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(form));const id=d.id;delete d.id;d.maximo_crc=d.maximo_crc||null;act(async()=>{await req('rangos'+(id?'/'+id:''),id?'PUT':'POST',d);form.reset();});};
document.querySelector('#evaluar').onclick=async()=>{try{const r=await req('evaluacion/'+sel.value);document.querySelector('#resultado').textContent=r.mensaje??('Mejor oferta CRC '+r.mejor_oferta+' | Proveedor '+r.proveedor_id+' | Ahorro '+r.ahorro_porcentaje+'% | '+r.clasificacion+' | '+(r.aprobador??'Sin rango configurado'));}catch(e){msg.textContent=e.message;}};
(async()=>{for(const l of await req('licitaciones')){const o=document.createElement('option');o.value=l.id;o.textContent=l.codigo;sel.append(o);}await cargar();})().catch(e=>msg.textContent=e.message);
</script>{% endblock %}
